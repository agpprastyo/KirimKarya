groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      # System Alerts
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"

      - alert: HighDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.device }}"
          description: "Disk usage is {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk usage on {{ $labels.device }}"
          description: "Disk usage is {{ $value }}%"

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter is not responding"

      - alert: HighRedisMemory
        expr: redis_used_memory_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"

      - alert: RedisMemoryCritical
        expr: redis_used_memory_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"

      # PostgreSQL Alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter is not responding"

      - alert: HighPostgreSQLConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connections"
          description: "Active connections: {{ $value }}"

      - alert: PostgreSQLSlowQueries
        expr: |
          pg_slow_queries > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected"
          description: "{{ $value }} slow queries detected"

      # API/BullMQ Alerts
      - alert: HighAPIErrorRate
        expr: |
          (sum(rate(http_server_duration_milliseconds_count{status=~"5.."}[5m])) / 
           sum(rate(http_server_duration_milliseconds_count[5m]))) * 100 > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "Error rate is {{ $value }}%"

      - alert: CriticalAPIErrorRate
        expr: |
          (sum(rate(http_server_duration_milliseconds_count{status=~"5.."}[5m])) / 
           sum(rate(http_server_duration_milliseconds_count[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical API error rate"
          description: "Error rate is {{ $value }}%"

      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95)"
          description: "p95 latency is {{ $value }}ms"

      - alert: BullMQHighFailureRate
        expr: |
          (sum(increase(bullmq_failed_jobs_total[1h])) /
           (sum(increase(bullmq_completed_jobs_total[1h])) + sum(increase(bullmq_failed_jobs_total[1h])))) * 100 > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High BullMQ job failure rate"
          description: "Failure rate is {{ $value }}%"

      - alert: BullMQQueueBacklog
        expr: |
          sum(bullmq_waiting_jobs) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Large BullMQ queue backlog"
          description: "Waiting jobs: {{ $value }}"

      - alert: BullMQProcessingStalled
        expr: |
          sum(bullmq_active_jobs) == 0 and sum(bullmq_waiting_jobs) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ processing appears stalled"
          description: "No active jobs but {{ $value }} waiting"

      # MinIO Alerts
      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MinIO is down"
          description: "MinIO is not responding"

      - alert: MinIOLowStorage
        expr: |
          (minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MinIO storage critically low"
          description: "Available storage: {{ $value }}%"

      # Service Health
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus monitoring is not responding"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Grafana is down"
          description: "Grafana dashboard is not responding"

  - name: kirimkarya-api
    rules:
      - alert: API_HighErrorRate
        expr: >
          (sum(rate(http_server_duration_milliseconds_count{status=~"5.."}[5m])) /
          sum(rate(http_server_duration_milliseconds_count[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API Error Rate > 5%"
          description: "Lebih dari 5% request ke layanan API gagal dalam 5 menit terakhir."

      - alert: API_HighLatency
        expr: >
          histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 Latency > 1s"
          description: "Respons API melambat, 5% pengguna mengalami waktu muat di atas 1 detik."

  - name: kirimkarya-worker
    rules:
      - alert: Worker_QueueStagnation
        expr: sum(bullmq_waiting_jobs) > 50
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Worker Queue Macet"
          description: "Antrean pekerja menumpuk lebih dari 50 pekerjaan. Worker service mungkin terhenti."

  - name: kirimkarya-storage
    rules:
      - alert: MinIO_StorageWarning
        expr: >
          (minio_cluster_capacity_usable_total_bytes - minio_cluster_capacity_usable_free_bytes) /
          minio_cluster_capacity_usable_total_bytes * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "MinIO Storage > 85%"
          description: "Kapasitas penyimpanan foto hampir penuh."


