name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Paraglide translations
        run: bun run --cwd apps/web paraglide-js compile --project ./project.inlang

      - name: Run Svelte diagnostics & check
        run: bun run --cwd apps/web check

      - name: Run TypeScript typecheck
        run: bun x tsc --noEmit

      - name: Run Tests
        run: bun test
